<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mausa Ji Quotes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0c10;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Canvas for Stars */
        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism Card */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(15, 12, 32, 0.85);
            border: 2px solid #ffd700;
            box-shadow: 0 0 25px #ffd700, inset 0 0 15px rgba(255, 215, 0, 0.5);
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            backdrop-filter: blur(5px);
        }

        .quote {
            font-size: 26px;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            margin-bottom: 25px;
            line-height: 1.5;
            min-height: 80px;
        }

        .author {
            font-size: 20px;
            font-weight: 600;
            color: #66fcf1;
            text-shadow: 0 0 8px rgba(102, 252, 241, 0.8);
            letter-spacing: 2px;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>

    <div class="card">
        <div class="quote" id="quoteText"></div>
        <div class="author" id="authorText"></div>
    </div>

    <script>
        // Background Stars Animation
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = [];
        const colors = ['#ffffff', '#ffd700', '#66fcf1', '#1f2833', '#ff007f'];

        for (let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color;
                ctx.fill();
                if (Math.random() > 0.95) {
                    star.color = colors[Math.floor(Math.random() * colors.length)];
                }
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // Typing Effect JavaScript
        const quote = "MONEY IS EVERYTHING,\nIF U HARD WORKING, U DESERVE.";
        const author = "— BY MAUSA JI";

        let quoteIndex = 0;
        let authorIndex = 0;

        function typeQuote() {
            if (quoteIndex < quote.length) {
                let char = quote.charAt(quoteIndex);
                document.getElementById('quoteText').innerHTML += char === '\n' ? '<br>' : char;
                quoteIndex++;
                setTimeout(typeQuote, 50);
            } else {
                setTimeout(typeAuthor, 300);
            }
        }

        function typeAuthor() {
            if (authorIndex < author.length) {
                document.getElementById('authorText').innerHTML += author.charAt(authorIndex);
                authorIndex++;
                setTimeout(typeAuthor, 70);
            }
        }

        window.onload = () => {
            setTimeout(typeQuote, 500);
        };
    </script>
</body>
</html>
